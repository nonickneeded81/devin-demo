<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bundesliga Odds Aggregator</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: #fff;
      color: #1a1a1a;
    }

    header {
      background: #d20515;
      color: #fff;
      padding: 24px 0;
      text-align: center;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    header p {
      font-size: 0.9rem;
      opacity: 0.85;
      margin-top: 4px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    .weekend-label {
      text-align: center;
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 24px;
    }

    .loading {
      text-align: center;
      padding: 60px 0;
      color: #999;
      font-size: 1rem;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #eee;
      border-top-color: #d20515;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      text-align: center;
      background: #fff3f3;
      border: 1px solid #ffcccc;
      border-radius: 12px;
      padding: 24px;
      color: #c00;
      font-size: 0.95rem;
    }

    .no-matches {
      text-align: center;
      padding: 60px 0;
      color: #999;
    }

    .match-card {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
      transition: box-shadow 0.2s;
    }

    .match-card:hover {
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .match-time {
      text-align: center;
      font-size: 0.8rem;
      color: #999;
      margin-bottom: 16px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .teams-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .team {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      max-width: 200px;
    }

    .team img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      margin-bottom: 8px;
    }

    .team-name {
      font-size: 0.9rem;
      font-weight: 700;
      text-align: center;
      line-height: 1.3;
    }

    .vs {
      font-size: 1.2rem;
      font-weight: 800;
      color: #ccc;
    }

    .odds-row {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .odds-box {
      flex: 1;
      max-width: 160px;
      text-align: center;
      background: #f7f7f7;
      border-radius: 10px;
      padding: 12px 8px;
      transition: background 0.15s;
    }

    .odds-box:hover {
      background: #eef;
    }

    .odds-label {
      font-size: 0.7rem;
      color: #999;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .odds-value {
      font-size: 1.3rem;
      font-weight: 800;
      color: #1a1a1a;
    }

    .bookmaker-count {
      text-align: center;
      font-size: 0.75rem;
      color: #bbb;
      margin-top: 12px;
    }

    @media (max-width: 600px) {
      .team img { width: 48px; height: 48px; }
      .team-name { font-size: 0.8rem; }
      .odds-value { font-size: 1.1rem; }
      .teams-row { gap: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Bundesliga Odds</h1>
    <p>Averaged betting odds from top European bookmakers</p>
  </header>

  <div class="container">
    <div id="weekend-label" class="weekend-label"></div>
    <div id="content">
      <div class="loading">
        <div class="spinner"></div>
        Loading odds...
      </div>
    </div>
  </div>

  <script>
    function formatDate(iso) {
      const d = new Date(iso);
      const opts = { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
      return d.toLocaleDateString('en-GB', opts);
    }

    function renderMatch(m) {
      const card = document.createElement('div');
      card.className = 'match-card';

      const time = document.createElement('div');
      time.className = 'match-time';
      time.textContent = formatDate(m.commence_time);
      card.appendChild(time);

      const teamsRow = document.createElement('div');
      teamsRow.className = 'teams-row';

      const homeTeam = document.createElement('div');
      homeTeam.className = 'team';
      const homeImg = document.createElement('img');
      homeImg.src = m.home_logo;
      homeImg.alt = m.home_team;
      homeImg.onerror = function() { this.style.display = 'none'; };
      const homeName = document.createElement('div');
      homeName.className = 'team-name';
      homeName.textContent = m.home_team;
      homeTeam.appendChild(homeImg);
      homeTeam.appendChild(homeName);

      const vs = document.createElement('div');
      vs.className = 'vs';
      vs.textContent = 'vs';

      const awayTeam = document.createElement('div');
      awayTeam.className = 'team';
      const awayImg = document.createElement('img');
      awayImg.src = m.away_logo;
      awayImg.alt = m.away_team;
      awayImg.onerror = function() { this.style.display = 'none'; };
      const awayName = document.createElement('div');
      awayName.className = 'team-name';
      awayName.textContent = m.away_team;
      awayTeam.appendChild(awayImg);
      awayTeam.appendChild(awayName);

      teamsRow.appendChild(homeTeam);
      teamsRow.appendChild(vs);
      teamsRow.appendChild(awayTeam);
      card.appendChild(teamsRow);

      const oddsRow = document.createElement('div');
      oddsRow.className = 'odds-row';

      const labels = ['Home', 'Draw', 'Away'];
      const values = [m.avg_home, m.avg_draw, m.avg_away];

      for (let i = 0; i < 3; i++) {
        const box = document.createElement('div');
        box.className = 'odds-box';
        const label = document.createElement('div');
        label.className = 'odds-label';
        label.textContent = labels[i];
        const val = document.createElement('div');
        val.className = 'odds-value';
        val.textContent = values[i].toFixed(2);
        box.appendChild(label);
        box.appendChild(val);
        oddsRow.appendChild(box);
      }

      card.appendChild(oddsRow);

      const count = document.createElement('div');
      count.className = 'bookmaker-count';
      count.textContent = 'Averaged from ' + m.num_bookmakers + ' bookmaker' + (m.num_bookmakers !== 1 ? 's' : '');
      card.appendChild(count);

      return card;
    }

    async function load() {
      const content = document.getElementById('content');
      const weekendLabel = document.getElementById('weekend-label');

      try {
        const res = await fetch('/api/odds');
        const data = await res.json();

        if (data.error) {
          content.innerHTML = '';
          const err = document.createElement('div');
          err.className = 'error-msg';
          err.textContent = data.error;
          content.appendChild(err);
          return;
        }

        if (data.weekend) {
          const from = new Date(data.weekend.from);
          const to = new Date(data.weekend.to);
          const opts = { weekday: 'long', month: 'long', day: 'numeric' };
          weekendLabel.textContent =
            from.toLocaleDateString('en-GB', opts) + ' \u2013 ' + to.toLocaleDateString('en-GB', opts);
        }

        content.innerHTML = '';

        if (!data.matches || data.matches.length === 0) {
          const noMatches = document.createElement('div');
          noMatches.className = 'no-matches';
          noMatches.textContent = 'No Bundesliga matches found for this weekend.';
          content.appendChild(noMatches);
          return;
        }

        data.matches.forEach(function(m) {
          content.appendChild(renderMatch(m));
        });

      } catch (e) {
        content.innerHTML = '';
        const err = document.createElement('div');
        err.className = 'error-msg';
        err.textContent = 'Failed to load odds. Please try again later.';
        content.appendChild(err);
      }
    }

    load();
  </script>
</body>
</html>
