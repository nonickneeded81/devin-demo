<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Actor Matcher</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #ffd1ff 100%);
      overflow: hidden;
      position: relative;
    }

    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      opacity: 0.8;
      animation: fall linear forwards;
      pointer-events: none;
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    .card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .cake-icon { font-size: 56px; margin-bottom: 8px; }

    h1 {
      font-family: 'Pacifico', cursive;
      font-size: 2rem;
      background: linear-gradient(135deg, #f857a6, #ff5858);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #888;
      font-size: 0.95rem;
      margin-bottom: 28px;
    }

    label {
      display: block;
      text-align: left;
      font-weight: 700;
      color: #444;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #eee;
      border-radius: 12px;
      font-size: 1rem;
      font-family: 'Nunito', sans-serif;
      transition: border-color 0.2s;
      margin-bottom: 18px;
      outline: none;
    }

    input:focus { border-color: #f857a6; }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #f857a6, #ff5858);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(248, 87, 166, 0.35);
    }

    button:active { transform: translateY(0); }

    .result {
      margin-top: 28px;
      padding: 24px;
      border-radius: 16px;
      background: linear-gradient(135deg, #fdfcfb, #e2d1c3);
      animation: pop 0.4s ease;
    }

    .result .greeting {
      font-family: 'Pacifico', cursive;
      font-size: 1.5rem;
      color: #f857a6;
      margin-bottom: 6px;
    }

    .result .actor {
      font-size: 1.1rem;
      color: #555;
      line-height: 1.5;
    }

    .result .actor strong { color: #333; }

    .balloons { font-size: 32px; margin-top: 10px; }

    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="cake-icon">&#127874;</div>
    <h1>Birthday Actor Matcher</h1>
    <p class="subtitle">Find which famous actor shares your birthday!</p>

    <form id="form">
      <label for="name">Your Name</label>
      <input id="name" type="text" placeholder="e.g. Chris" autocomplete="off">

      <label for="birthdate">Your Birthdate</label>
      <input id="birthdate" type="date" required>

      <button type="submit">Find My Actor &#127881;</button>
    </form>

    <div id="result" class="result" style="display:none">
      <div class="greeting" id="greeting"></div>
      <div class="actor" id="actor"></div>
      <div class="balloons">&#127880; &#127881; &#127882;</div>
    </div>
  </div>

  <script>
    function spawnConfetti() {
      const colors = ['#f857a6','#ff5858','#fad0c4','#a18cd1','#fbc2eb','#ffd1ff','#43e97b','#38f9d7','#ffecd2'];
      for (let i = 0; i < 60; i++) {
        const el = document.createElement('div');
        el.className = 'confetti';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.top = '-10px';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.width = (6 + Math.random() * 8) + 'px';
        el.style.height = (6 + Math.random() * 8) + 'px';
        el.style.animationDuration = (2 + Math.random() * 3) + 's';
        el.style.animationDelay = (Math.random() * 1.5) + 's';
        document.body.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
      }
    }

    // gentle background confetti
    setInterval(() => {
      const el = document.createElement('div');
      el.className = 'confetti';
      const colors = ['#f857a6','#ff5858','#fad0c4','#a18cd1','#fbc2eb'];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.top = '-10px';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.width = '6px';
      el.style.height = '6px';
      el.style.animationDuration = (3 + Math.random() * 3) + 's';
      document.body.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }, 400);

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const birthdate = document.getElementById('birthdate').value;
      if (!birthdate) return;

      const res = await fetch('/match', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({name, birthdate})
      });
      const data = await res.json();

      document.getElementById('greeting').textContent = 'Happy Birthday, ' + data.name + '!';
      document.getElementById('actor').innerHTML =
        'An actor who shares your birthday: <strong>' + data.actor + '</strong>';
      document.getElementById('result').style.display = 'block';
      spawnConfetti();
    });
  </script>
</body>
</html>
